name: Test envoi Telegram

# Ce workflow ne se lance JAMAIS automatiquement, uniquement via le bouton
# "Run workflow" dans l'onglet Actions. Il sert juste a verifier que les
# secrets TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID sont corrects.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un message de test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Test reussi : le bot Crous Toulouse peut bien t'envoyer des messages !"
